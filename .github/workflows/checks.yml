# Lint, tests, and the generated process graph — on every PR, and reused by publish.yml so an
# image is never built from a commit that fails them.
name: Checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # `--locked`: the lockfile is the dependency list CI tests against. Without it uv would
      # quietly re-resolve, and CI could pass on versions nobody committed.
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest
